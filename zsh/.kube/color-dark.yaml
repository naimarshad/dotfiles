# yaml-language-server: $schema=https://github.com/kubecolor/kubecolor/raw/main/config-schema.json
#
# kubecolor theme, dark half of color-light.yaml (see there for why every
# colour is explicit hex). Gruvbox Dark, the same values as tmux's
# palettes/gruvbox-dark.conf.

preset: dark

theme:
  base:
    info:      "#ebdbb2"          # plain text (gruvbox dark fg)
    primary:   "#d3869b"          # purple: numbers, "unchanged", "paused"
    secondary: "#83a598"          # blue: flags, "resumed", urls
    success:   "#b8bb26"          # green: Running, created, added
    warning:   "#fabd2f"          # yellow: Terminating, configured, scaled
    danger:    "#fb4934"          # red: Failed, deleted, errors
    muted:     "#a89984:italic"   # fg4
    key:       "#83a598 / #8ec07c"  # blue / aqua, cycled by indentation in describe
  default: "#b8bb26"
  data:
    string: "#fabd2f"
    null:   "#a89984:italic"
    duration: "#a89984"
  table:
    header:  "#ebdbb2:bold"
    columns: "#ebdbb2 / #83a598"
  stderr:
    error: "#fb4934:bold"
