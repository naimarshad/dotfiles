# yaml-language-server: $schema=https://github.com/kubecolor/kubecolor/raw/main/config-schema.json
#
# kubecolor theme, light half. `stow zsh` deploys it as ~/.kube/color-light.yaml
# and niri/.config/niri/theme-sync.sh points ~/.kube/color.yaml at it or at
# color-dark.yaml, following Noctalia's theme mode.
#
# kubecolor's built-in "light" preset is written in ANSI colour *names*
# (info: black, key: hiblue / blue, string: yellow, muted: gray). Gruvbox
# remaps those slots: in the Gruvbox Light palette Noctalia renders into
# Ghostty, ANSI black (0) is #fbf1c7, i.e. the background, so kubecolor's
# default text vanished, white (7) is the dim #7c6f64 and yellow (3) is the
# washed-out #d79921. Every colour here is therefore explicit hex from that
# same render (foreground, background and palette slots 9-14), so the output
# no longer depends on what the terminal put in each ANSI slot. Noctalia has
# no kubecolor template: keep this in step with color-dark.yaml, tmux and k9s.
#
# Colour syntax: "fg=#hex", optional ":bold" / ":italic", and "a / b" for
# slices that cycle by column or indentation.

preset: light

theme:
  base:
    info:      "#3c3836"          # plain text (gruvbox light fg)
    primary:   "#8f3f71"          # purple: numbers, "unchanged", "paused"
    secondary: "#076678"          # blue: flags, "resumed", urls
    success:   "#79740e"          # green: Running, created, added
    warning:   "#b57614"          # yellow: Terminating, configured, scaled
    danger:    "#9d0006"          # red: Failed, deleted, errors
    muted:     "#7c6f64:italic"   # fg4, not ANSI gray (#928374 is too faint on cream)
    key:       "#076678 / #427b58"  # blue / aqua, cycled by indentation in describe
  default: "#79740e"
  data:
    string: "#b57614"
    null:   "#7c6f64:italic"
    duration: "#7c6f64"
  table:
    header:  "#3c3836:bold"
    columns: "#3c3836 / #076678"
  stderr:
    error: "#9d0006:bold"
