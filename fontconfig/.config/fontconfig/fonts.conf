<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Grayscale AA, not subpixel. Firefox/Zen render text through FreeType
    directly and do honour rgba, and eDP-1 runs at fractional scale 1.25
    (outputs.kdl), which breaks the RGB subpixel stripe's pixel alignment
    and showed up as torn/fringed glyph edges in the browser. GTK/Qt/QML
    apps (Ghostty, Noctalia) never showed it because they ignore rgba and
    do their own grayscale-AA text rendering regardless of this setting.
  -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>

</fontconfig>
