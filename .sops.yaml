# SOPS rules for this repo.
#
# The private key lives at ~/.config/sops/age/keys.txt (mode 600, never committed).
# ~/.zshrc exports SOPS_AGE_KEY_FILE to that path, so sops finds it.
# Back the private key up somewhere outside this repo: without it the encrypted
# files here are unrecoverable.
#
# Policy: one age key per machine branch, and they are never cross-decryptable.
# Only ri-t-0931's key is a recipient here; machine/workforce has its own key and
# its own settings.sops.toml on its own branch. The branches are never merged, so
# neither file ever needs the other's key. This is deliberate: ri-t-0931 is a work
# machine and its settings.toml carries work credentials (prod kubeconfig, work
# Google OAuth state, github PAT), which the personal machine has no business
# decrypting. Do not add a second recipient here without a reason to revisit that.
creation_rules:
  - path_regex: \.sops\.(toml|yaml|json|env)$
    age: age13fqpf0ns86wh6use07ktyu8g7m0m8zn82r0man55ag930pdzsp9q3slq0j
