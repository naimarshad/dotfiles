# Managed via dotfiles (stow package: arch-update). Full defaults come from
# `arch-update --gen-config`; only machine-specific deviations are set here.
# Because ~/.config/arch-update/arch-update.conf is a stow symlink, running
# `arch-update --edit-config` edits this repo file directly.

# No Flatpak on this machine.
NoFlatpak

# Not using ALHP optimised repos here.
NoALHPCheck

# Be explicit instead of relying on auto-detect.
AURHelper=paru
PrivilegeElevationCommand=sudo

# Post-update `paccache` retention (default is 3; 2 older versions is enough here).
KeepOldPackages=2
KeepUninstalledPackages=0

# Review .pacnew files in nvim. arch-update validates `command -v` on the first
# word only, and Arch's neovim package ships no `nvimdiff` symlink, so use `nvim -d`.
DiffProg=nvim -d
