# ============================================================
# ~/.config/hypr/hypridle.conf  (niri edition)
#
# Identical logic to the Hyprland version but uses:
#   niri msg action power-off-monitors   (replaces hyprctl dispatch dpms off)
#   niri msg action power-on-monitors    (replaces hyprctl dispatch dpms on)
#
# The lock command uses Quickshell IPC — compositor-agnostic.
# ============================================================

general {
    lock_cmd        = qs -c noctalia-shell ipc call lockScreen lock
    before_sleep_cmd = qs -c noctalia-shell ipc call lockScreen lock
    after_sleep_cmd = niri msg action power-on-monitors
}

# Lock after 10 minutes of idle
listener {
    timeout  = 600
    on-timeout = qs -c noctalia-shell ipc call lockScreen lock
}

# Turn off displays after 3 hours of idle
listener {
    timeout   = 10800
    on-timeout = niri msg action power-off-monitors
    on-resume  = niri msg action power-on-monitors
}
