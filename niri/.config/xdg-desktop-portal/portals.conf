# XDG Desktop Portal backend configuration for niri
#
# niri registers org.gnome.Mutter.ScreenCast on the D-Bus session when
# launched via `niri-session`. xdg-desktop-portal-gnome uses that interface
# and supports both full-monitor AND individual window capture — the only
# option that gives you a window picker in Chrome/Zen.
#
# xdg-desktop-portal-wlr only captures full outputs (zwlr-screencopy-v1),
# so window selection is impossible with it — do NOT route ScreenCast there.
#
# Required packages (Arch):
#   pacman -S xdg-desktop-portal-gnome    # for screen sharing (windows + monitors)
#   pacman -S xdg-desktop-portal-gtk      # fallback for file picker / settings
#
# Launch niri via `niri-session` (not plain `niri`) so it registers its
# D-Bus screencasting service before the portal tries to connect.

[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome

[niri]
default=gnome;gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
