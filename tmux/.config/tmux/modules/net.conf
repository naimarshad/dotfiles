# vim:set ft=tmux:
# Wi-Fi / ethernet module. Catppuccin has no network module of its own.
%hidden MODULE_NAME="net"

set -g  "@catppuccin_${MODULE_NAME}_icon" " #(sh ~/.config/tmux/scripts/net.sh icon)"
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_green}"
set -g  "@catppuccin_${MODULE_NAME}_text" " #(sh ~/.config/tmux/scripts/net.sh text)"

# Absolute path to catppuccin's shared module builder, set in tmux.conf.
source -F "#{@_module_util}"
