# vim:set ft=tmux:
# Overrides catppuccin's own kube module, which expects the kube-tmux plugin.
%hidden MODULE_NAME="kube"

# Catppuccin's version of this module already ran and derived the icon
# background from its own colour; clear it so ours is picked up instead.
set -gu "@catppuccin_status_${MODULE_NAME}_icon_bg"

set -g  "@catppuccin_${MODULE_NAME}_icon" "󱃾 "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_blue}"
set -g  "@catppuccin_${MODULE_NAME}_text" " #(sh ~/.config/tmux/scripts/kube.sh)"

# Absolute path to catppuccin's shared module builder, set in tmux.conf.
source -F "#{@_module_util}"
