# vim:set ft=tmux:
# Sourced by tmux.conf, and re-sourced into a running server by
# niri/.config/niri/theme-sync.sh when Noctalia's theme mode flips.
#
# palette.conf is a gitignored symlink to palettes/gruvbox-{light,dark}.conf
# that theme-sync.sh maintains. Light is loaded first so a fresh checkout,
# before theme-sync has ever run, still gets a complete palette.
source-file ~/.config/tmux/palettes/gruvbox-light.conf
source-file -q ~/.config/tmux/palette.conf

# -F expands the @gb_* formats at set time, leaving plain hex in the option,
# which is why this whole file is re-sourced on a mode change.
set -gF status-style                   "bg=#{@gb_bg1},fg=#{@gb_fg1}"
set -gF window-status-style            "fg=#{@gb_fg4}"
set -gF window-status-current-style    "fg=#{@gb_bg0},bg=#{@gb_yellow},bold"
set -gF window-status-activity-style   "fg=#{@gb_orange}"
set -gF window-status-bell-style       "fg=#{@gb_red},bold"
set -gF pane-border-style              "fg=#{@gb_bg2}"
set -gF pane-active-border-style       "fg=#{@gb_aqua}"
set -gF message-style                  "bg=#{@gb_bg2},fg=#{@gb_fg1}"
set -gF message-command-style          "bg=#{@gb_bg2},fg=#{@gb_fg1}"
set -gF mode-style                     "bg=#{@gb_bg3},fg=#{@gb_fg1}"
set -gF copy-mode-match-style          "bg=#{@gb_yellow},fg=#{@gb_bg0}"
set -gF copy-mode-current-match-style  "bg=#{@gb_orange},fg=#{@gb_bg0},bold"
set -gF clock-mode-colour              "#{@gb_aqua}"
set -gF display-panes-colour           "#{@gb_bg3}"
set -gF display-panes-active-colour    "#{@gb_aqua}"
