# vim:set ft=tmux:

# ── general ──────────────────────────────────────────────────────────────────
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  history-limit 100000
set  -g  escape-time 10
set  -g  focus-events on
set  -g  status-interval 5
set  -g  detach-on-destroy off   # hop to another session instead of dropping out
setw -g  mode-keys vi

# Italics and truecolor inside tmux (Ghostty draws italics in Radon).
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",xterm-ghostty:RGB"

# ── status line ──────────────────────────────────────────────────────────────
# Plain tmux formats, no theme plugin. The colours come from @gv_* in
# themes/gruvbox-light.conf, loaded at the bottom of this file; they are expanded
# when the bar is drawn, so the load order does not matter.
set -g status-left-length 120
set -g status-right-length 60

set -g  status-left ''
set -ag status-left '#[bg=#{@gv_blue},fg=#{@gv_bg},bold] #S '
set -ag status-left '#[bg=#{@gv_bg1},fg=#{@gv_aqua},nobold] 󱃾 #(sh ~/.config/tmux/scripts/kube.sh) '
set -ag status-left '#[fg=#{@gv_green}]#(sh ~/.config/tmux/scripts/net.sh icon)#(sh ~/.config/tmux/scripts/net.sh text) '
set -ag status-left '#[fg=#{@gv_orange}]#(sh ~/.config/tmux/scripts/battery.sh icon)#(sh ~/.config/tmux/scripts/battery.sh text) '
set -ag status-left '#[default]'

set -g  status-right ''
set -ag status-right '#[fg=#{@gv_gray}]󰃰 %Y-%m-%d %H:%M '

# ── mouse: sessions ──────────────────────────────────────────────────────────
# The left block is the session/host block, so clicking anywhere in it acts on
# sessions. The window list keeps tmux's default click-to-select behaviour.
bind -n MouseDown1StatusLeft   choose-tree -Zs
bind -n WheelUpStatusLeft      switch-client -p
bind -n WheelDownStatusLeft    switch-client -n

bind -n MouseDown3StatusLeft display-menu -T '#[align=centre]#{session_name}' -x M -y S \
	'Choose session'   s 'choose-tree -Zs' \
	'Previous session' p 'switch-client -p' \
	'Next session'     n 'switch-client -n' \
	'' \
	'New session'      c 'command-prompt -p "session name:" { new-session -s "%%" }' \
	'Rename session'   r 'command-prompt -I "#S" { rename-session "%%" }' \
	'' \
	'Detach'           d 'detach-client'

# ── misc keys ────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'
bind s choose-tree -Zs
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
source-file -q "$HOME/.config/tmux/themes/gruvbox-light.conf"
