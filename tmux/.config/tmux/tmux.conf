# vim:set ft=tmux:

# ── general ──────────────────────────────────────────────────────────────────
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  history-limit 100000
set  -g  escape-time 10
set  -g  focus-events on
set  -g  status-interval 5
set  -g  detach-on-destroy off   # hop to another session instead of dropping out
setw -g  mode-keys vi

# Italics and truecolor inside tmux (Ghostty draws italics in Radon).
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",xterm-ghostty:RGB"

# ── catppuccin ───────────────────────────────────────────────────────────────
# Options have to be set before the theme is loaded.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"

# Status modules flat as well: drop the powerline half-circle cap (U+E0B6) that
# @catppuccin_status_left_separator defaults to, and separate the blocks with
# plain gaps on the status background instead.
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Catppuccin's icons carry a trailing space but no leading one, so they sit
# flush against the left edge of their coloured block. Pad both sides. These
# are -ogq upstream, so setting them here (pre-load) wins.
set -g @catppuccin_session_icon "  "
set -g @catppuccin_date_time_icon " 󰃰 "

# Gruvbox instead of a Catppuccin flavour. The plugin's palette files set each
# @thm_* with `set -o`, which never overwrites, so defining them first wins. The
# neutrals follow Noctalia's render; Noctalia has no accent colours for tmux, so
# those are the Gruvbox bright accents, copied by hand. The render has to be
# sourced first, or every #{@noctalia_*} below expands to an empty string.
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
set -gqF @thm_bg              "#{@noctalia_surface}"
set -gqF @thm_fg               "#{@noctalia_on_surface}"
set -gqF @thm_mantle           "#{@noctalia_surface_container_low}"
set -gqF @thm_crust            "#{@noctalia_surface}"
set -gqF @thm_surface_0        "#{@noctalia_surface_container}"
set -gqF @thm_surface_1        "#{@noctalia_surface_container_high}"
set -gqF @thm_surface_2        "#{@noctalia_surface_container_highest}"
set -gqF @thm_overlay_0        "#{@noctalia_outline_variant}"
set -gqF @thm_overlay_1        "#{@noctalia_outline}"
set -gqF @thm_overlay_2        "#{@noctalia_outline}"
set -gqF @thm_subtext_0        "#{@noctalia_on_surface_variant}"
set -gqF @thm_subtext_1        "#{@noctalia_on_surface_variant}"
set -gqF @thm_lavender         "#{@noctalia_primary}"
set -gq  @thm_rosewater        "#d5c4a1"
set -gq  @thm_flamingo         "#d3869b"
set -gq  @thm_pink             "#d3869b"
set -gq  @thm_mauve            "#d3869b"
set -gq  @thm_red              "#fb4934"
set -gq  @thm_maroon           "#cc241d"
set -gq  @thm_peach            "#fe8019"
set -gq  @thm_yellow           "#fabd2f"
set -gq  @thm_green            "#b8bb26"
set -gq  @thm_teal             "#8ec07c"
set -gq  @thm_sky              "#83a598"
set -gq  @thm_sapphire         "#458588"
set -gq  @thm_blue             "#83a598"

# The theme lives outside this stow package -- clone it with:
#   git clone -b v2.3.0 https://github.com/catppuccin/tmux.git \
#       ~/.config/tmux/plugins/catppuccin/tmux
#
# Sourced directly rather than via `run` so that ordering is guaranteed: the
# custom modules below expand @thm_* colours at parse time and need the palette
# to already exist.
# Paths are relative to this file (`source -F` does not expand `~`).
source -F "#{d:current_file}/plugins/catppuccin/tmux/catppuccin_options_tmux.conf"
source -F "#{d:current_file}/plugins/catppuccin/tmux/catppuccin_tmux.conf"

# ── status line ──────────────────────────────────────────────────────────────
# Host info on the left; window list fills the rest.
#
# The modules can't reach the theme's shared builder relative to themselves:
# modules/ is a stow symlink, so a "../plugins" in there resolves against the
# dotfiles repo rather than ~/.config/tmux. Hand them an absolute path instead.
set -gF @_module_util "#{d:current_file}/plugins/catppuccin/tmux/utils/status_module.conf"

source -F "#{d:current_file}/modules/kube.conf"
source -F "#{d:current_file}/modules/net.conf"
source -F "#{d:current_file}/modules/battery.conf"

set -gu @_module_util

set -g status-left-length 120
set -g status-right-length 60

set -g  status-left ''
set -ag status-left '#{E:@catppuccin_status_session}'
set -ag status-left '#{E:@catppuccin_status_kube}'
set -ag status-left '#{E:@catppuccin_status_net}'
set -ag status-left '#{E:@catppuccin_status_battery}'

set -g  status-right ''
set -ag status-right '#{E:@catppuccin_status_date_time}'

# ── mouse: sessions ──────────────────────────────────────────────────────────
# The left block is the session/host block, so clicking anywhere in it acts on
# sessions. The window list keeps tmux's default click-to-select behaviour.
bind -n MouseDown1StatusLeft   choose-tree -Zs
bind -n WheelUpStatusLeft      switch-client -p
bind -n WheelDownStatusLeft    switch-client -n

bind -n MouseDown3StatusLeft display-menu -T '#[align=centre]#{session_name}' -x M -y S \
	'Choose session'   s 'choose-tree -Zs' \
	'Previous session' p 'switch-client -p' \
	'Next session'     n 'switch-client -n' \
	'' \
	'New session'      c 'command-prompt -p "session name:" { new-session -s "%%" }' \
	'Rename session'   r 'command-prompt -I "#S" { rename-session "%%" }' \
	'' \
	'Detach'           d 'detach-client'

# ── misc keys ────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'
bind s choose-tree -Zs
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
