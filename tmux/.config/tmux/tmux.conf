# vim:set ft=tmux:
# ~/.config/tmux/tmux.conf

# ── general ──────────────────────────────────────────────────────────────────
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 100000
set  -g escape-time 10
set  -g focus-events on
set  -g status-interval 5
set  -g detach-on-destroy off   # hop to another session instead of dropping out
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
# True colour, so the hex values below render exactly rather than being
# approximated down to the 256-colour cube.
set -ga terminal-overrides ",*256col*:Tc"

# Keep TPM and every plugin in one directory. TPM defaults to ~/.tmux/plugins,
# which is how this config previously ended up with plugins split across two
# directories and run lines pointing at a path that did not exist.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# ── palette: gruvbox light ───────────────────────────────────────────────────
# The same hex Noctalia renders into ghostty/themes/noctalia for its Gruvbox
# Light scheme (background, foreground and palette slots 9-14), so panes, status
# bar and every terminal app share one palette. Noctalia has no tmux template,
# so this block is kept by hand: if the Noctalia scheme changes, change it here
# too. The scripts in scripts/ read these back with `tmux show -gqv @gb_<name>`,
# which keeps the colours defined in exactly one place.
set -g @gb_bg0    "#fbf1c7"
set -g @gb_bg1    "#ebdbb2"
set -g @gb_bg2    "#d5c4a1"
set -g @gb_bg3    "#bdae93"
set -g @gb_fg1    "#3c3836"
set -g @gb_fg4    "#7c6f64"
set -g @gb_red    "#9d0006"
set -g @gb_green  "#79740e"
set -g @gb_yellow "#b57614"
set -g @gb_blue   "#076678"
set -g @gb_purple "#8f3f71"
set -g @gb_aqua   "#427b58"
set -g @gb_orange "#af3a03"

# ── styles ───────────────────────────────────────────────────────────────────
# -F expands the @gb_* formats at set time, leaving plain hex in the option.
set -gF status-style                   "bg=#{@gb_bg1},fg=#{@gb_fg1}"
set -gF window-status-style            "fg=#{@gb_fg4}"
set -gF window-status-current-style    "fg=#{@gb_bg0},bg=#{@gb_yellow},bold"
set -gF window-status-activity-style   "fg=#{@gb_orange}"
set -gF window-status-bell-style       "fg=#{@gb_red},bold"
set -gF pane-border-style              "fg=#{@gb_bg2}"
set -gF pane-active-border-style       "fg=#{@gb_aqua}"
set -gF message-style                  "bg=#{@gb_bg2},fg=#{@gb_fg1}"
set -gF message-command-style          "bg=#{@gb_bg2},fg=#{@gb_fg1}"
set -gF mode-style                     "bg=#{@gb_bg3},fg=#{@gb_fg1}"
set -gF copy-mode-match-style          "bg=#{@gb_yellow},fg=#{@gb_bg0}"
set -gF copy-mode-current-match-style  "bg=#{@gb_orange},fg=#{@gb_bg0},bold"
set -gF clock-mode-colour              "#{@gb_aqua}"
set -gF display-panes-colour           "#{@gb_bg3}"
set -gF display-panes-active-colour    "#{@gb_aqua}"

set -g window-status-separator ""
set -g window-status-format         " #I #W "
set -g window-status-current-format " #I #W "

# ── status line ──────────────────────────────────────────────────────────────
# Deliberately NOT set with -F: these contain #{pane_current_path}, which -F
# would expand once here at parse time instead of per render, freezing git.sh
# to whatever directory the server happened to start in. Hex is written out
# literally for the same reason.
set -g status-left-length  120
set -g status-right-length 150

# session | kube context
set -g status-left "#[fg=#fbf1c7,bg=#427b58,bold]  #S #[default]#(sh ~/.config/tmux/scripts/kube.sh '#{pane_tty}')"

# git branch | cpu | battery | clock | host
set -g status-right "#(sh ~/.config/tmux/scripts/git.sh '#{pane_current_path}')"
set -ag status-right "#[fg=#fbf1c7,bg=#8f3f71]  #{cpu_percentage} #[default]"
set -ag status-right "#(sh ~/.config/tmux/scripts/battery.sh)"
set -ag status-right "#[fg=#fbf1c7,bg=#076678] 󰃰 %Y-%m-%d %H:%M #[default]"
set -ag status-right "#[fg=#fbf1c7,bg=#7c6f64,bold] 󰒋 #h #[default]"

# ── mouse: sessions on the left block ────────────────────────────────────────
bind -n MouseDown1StatusLeft choose-tree -Zs
bind -n WheelUpStatusLeft    switch-client -p
bind -n WheelDownStatusLeft  switch-client -n

bind -n MouseDown3StatusLeft display-menu -T '#[align=centre]#{session_name}' -x M -y S \
	'Choose session'   s 'choose-tree -Zs' \
	'Previous session' p 'switch-client -p' \
	'Next session'     n 'switch-client -n' \
	'' \
	'New session'      c 'command-prompt -p "session name:" { new-session -s "%%" }' \
	'Rename session'   r 'command-prompt -I "#S" { rename-session "%%" }' \
	'' \
	'Detach'           d 'detach-client'

# ── keys ─────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'
bind s choose-tree -Zs
# Stock % and " open in the home directory; these inherit the pane's path.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# ── plugins ──────────────────────────────────────────────────────────────────
# tmux-cpu supplies #{cpu_percentage} by rewriting status-right when it loads,
# so it has to come after the status line is defined above. Battery and theming
# are handled by scripts/ and the palette instead of by plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Restore pane contents and nvim sessions along with the layout.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Save automatically every 15 minutes, but never restore without being asked:
# an automatic restore on server start is startling when you wanted a clean
# session. Restore by hand with prefix + Ctrl-r.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Wayland: tmux-yank picks wl-copy automatically (no xclip/xsel installed).
set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
