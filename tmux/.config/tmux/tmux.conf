# vim:set ft=tmux:
# ~/.config/tmux/tmux.conf

# ── general ──────────────────────────────────────────────────────────────────
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 100000
set  -g escape-time 10
set  -g focus-events on
set  -g status-interval 5
set  -g detach-on-destroy off   # hop to another session instead of dropping out
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
# True colour, so the hex values below render exactly rather than being
# approximated down to the 256-colour cube.
set -ga terminal-overrides ",*256col*:Tc"

# Keep TPM and every plugin in one directory. TPM defaults to ~/.tmux/plugins,
# which is how this config previously ended up with plugins split across two
# directories and run lines pointing at a path that did not exist.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# ── palette + styles ─────────────────────────────────────────────────────────
# Gruvbox light or dark, following Noctalia's theme mode. The @gb_* palette and
# the -F styles built from it live in theme.conf, which theme-sync.sh re-sources
# on a mode change. The scripts in scripts/ read colours back with
# `tmux show -gqv @gb_<name>`, so they follow the switch without a restart.
source-file ~/.config/tmux/theme.conf

set -g window-status-separator ""
set -g window-status-format         " #I #W "
set -g window-status-current-format " #I #W "

# ── status line ──────────────────────────────────────────────────────────────
# Deliberately NOT set with -F: these contain #{pane_current_path}, which -F
# would expand once here at parse time instead of per render, freezing git.sh
# to whatever directory the server happened to start in. Colours are
# #{@gb_*} formats, expanded per render too, so they follow a palette switch.
set -g status-left-length  120
set -g status-right-length 150

# session | kube context
set -g status-left "#[fg=#{@gb_bg0},bg=#{@gb_aqua},bold]  #S #[default]#(sh ~/.config/tmux/scripts/kube.sh '#{pane_tty}')"

# git branch | cpu | battery | clock | host
set -g status-right "#(sh ~/.config/tmux/scripts/git.sh '#{pane_current_path}')"
set -ag status-right "#[fg=#{@gb_bg0},bg=#{@gb_purple}]  #{cpu_percentage} #[default]"
set -ag status-right "#(sh ~/.config/tmux/scripts/battery.sh)"
set -ag status-right "#[fg=#{@gb_bg0},bg=#{@gb_blue}] 󰃰 %Y-%m-%d %H:%M #[default]"
set -ag status-right "#[fg=#{@gb_bg0},bg=#{@gb_fg4},bold] 󰒋 #h #[default]"

# ── mouse: sessions on the left block ────────────────────────────────────────
bind -n MouseDown1StatusLeft choose-tree -Zs
bind -n WheelUpStatusLeft    switch-client -p
bind -n WheelDownStatusLeft  switch-client -n

bind -n MouseDown3StatusLeft display-menu -T '#[align=centre]#{session_name}' -x M -y S \
	'Choose session'   s 'choose-tree -Zs' \
	'Previous session' p 'switch-client -p' \
	'Next session'     n 'switch-client -n' \
	'' \
	'New session'      c 'command-prompt -p "session name:" { new-session -s "%%" }' \
	'Rename session'   r 'command-prompt -I "#S" { rename-session "%%" }' \
	'' \
	'Detach'           d 'detach-client'

# ── keys ─────────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'
bind s choose-tree -Zs
# Stock % and " open in the home directory; these inherit the pane's path.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# ── plugins ──────────────────────────────────────────────────────────────────
# tmux-cpu supplies #{cpu_percentage} by rewriting status-right when it loads,
# so it has to come after the status line is defined above. Battery and theming
# are handled by scripts/ and the palette instead of by plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Restore pane contents and nvim sessions along with the layout.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Save automatically every 15 minutes, but never restore without being asked:
# an automatic restore on server start is startling when you wanted a clean
# session. Restore by hand with prefix + Ctrl-r.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Wayland: tmux-yank picks wl-copy automatically (no xclip/xsel installed).
set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
