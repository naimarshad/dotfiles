# ~/.config/tmux/tmux.conf

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# True colour, so the theme's hex values render exactly rather than being
# approximated. Without this the gruvbox "dark" variant cannot match Ghostty.
set -ga terminal-overrides ",*256col*:Tc"

# Keep TPM and every plugin in one directory. TPM defaults to ~/.tmux/plugins,
# which is how this config previously ended up with plugins in two places and
# two "run" lines pointing at a directory that did not exist.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Gruvbox dark, matched to Ghostty, Neovim, bat, btop and k9s.
# "dark" is the true-colour variant (#282828 / #ebdbb2). The plugin's own
# default is "dark256", which approximates the palette in 256 colours, so this
# line is required, not decorative.
set -g @tmux-gruvbox 'dark'

# The theme owns status-left and status-right and exposes four slots.
# The cpu and battery placeholders are substituted by tmux-cpu and
# tmux-battery, which is why those plugins must load after the theme.
set -g @tmux-gruvbox-left-status-a '#S'
set -g @tmux-gruvbox-right-status-x '#{cpu_percentage} #{battery_icon}#{battery_percentage}'
set -g @tmux-gruvbox-right-status-y '%Y-%m-%d %H:%M'
set -g @tmux-gruvbox-right-status-z '#h'

set -g status-right-length 100
set -g status-left-length 100

# List of plugins. Order matters: the theme sets status-right first, then
# tmux-cpu and tmux-battery interpolate their placeholders into it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
