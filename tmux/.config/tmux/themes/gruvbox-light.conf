# Gruvbox Light (medium contrast), hand-written for the macOS machine. The
# Noctalia-generated noctalia.conf next to it is the Linux counterpart and is
# not loaded here.

# Palette
set -gq @gv_bg "#fbf1c7"
set -gq @gv_bg1 "#ebdbb2"
set -gq @gv_bg2 "#d5c4a1"
set -gq @gv_bg3 "#bdae93"
set -gq @gv_fg "#3c3836"
set -gq @gv_fg2 "#504945"
set -gq @gv_gray "#7c6f64"
set -gq @gv_red "#9d0006"
set -gq @gv_green "#79740e"
set -gq @gv_yellow "#b57614"
set -gq @gv_blue "#076678"
set -gq @gv_purple "#8f3f71"
set -gq @gv_aqua "#427b58"
set -gq @gv_orange "#af3a03"

# The status scripts (kube, net, battery) read @thm_red for their warning
# colour. Define it here so they work without the catppuccin theme.
set -gqF @thm_red "#{@gv_red}"

# Styles
set -gF status-style "bg=#{@gv_bg1},fg=#{@gv_fg}"
set -gF window-status-style "fg=#{@gv_gray}"
set -gF window-status-current-style "bg=#{@gv_bg2},fg=#{@gv_fg},bold"
set -gF window-status-last-style "fg=#{@gv_fg},bold"
set -gF window-status-activity-style "bg=#{@gv_yellow},fg=#{@gv_bg}"
set -gF window-status-bell-style "bg=#{@gv_red},fg=#{@gv_bg},bold"
set -gF pane-border-style "fg=#{@gv_bg3}"
set -gF pane-active-border-style "fg=#{@gv_green}"
set -gF mode-style "bg=#{@gv_yellow},fg=#{@gv_bg},bold"
set -gF message-style "bg=#{@gv_bg2},fg=#{@gv_fg}"
set -gF message-command-style "bg=#{@gv_bg2},fg=#{@gv_fg}"
set -gF popup-style "bg=#{@gv_bg},fg=#{@gv_fg}"
set -gF popup-border-style "fg=#{@gv_gray}"
set -gF menu-style "bg=#{@gv_bg1},fg=#{@gv_fg}"
set -gF menu-selected-style "bg=#{@gv_green},fg=#{@gv_bg},bold"
set -gF menu-border-style "fg=#{@gv_gray}"
set -gF copy-mode-match-style "bg=#{@gv_yellow},fg=#{@gv_bg}"
set -gF copy-mode-current-match-style "bg=#{@gv_orange},fg=#{@gv_bg},bold"
set -gF copy-mode-selection-style "bg=#{@gv_bg3},fg=#{@gv_fg}"
set -gF clock-mode-colour "#{@gv_green}"
